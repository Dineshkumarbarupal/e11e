services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: e11e
      POSTGRES_USER: e11e
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-only-change-me}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - e11e_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U e11e -d e11e"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - e11e_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    env_file:
      - ./server/.env
    environment:
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://e11e:${POSTGRES_PASSWORD:-local-only-change-me}@postgres:5432/e11e
      REDIS_URL: redis://redis:6379
    ports:
      - "127.0.0.1:8787:8787"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["sh", "-c", "node src/migrate.js && node src/index.js"]
    restart: unless-stopped

  worker:
    build:
      context: ./server
      dockerfile: Dockerfile
    env_file:
      - ./server/.env
    environment:
      DATABASE_URL: postgresql://e11e:${POSTGRES_PASSWORD:-local-only-change-me}@postgres:5432/e11e
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started
    command: ["node", "src/worker.js"]
    restart: unless-stopped

  scheduler:
    build:
      context: ./server
      dockerfile: Dockerfile
    env_file:
      - ./server/.env
    environment:
      DATABASE_URL: postgresql://e11e:${POSTGRES_PASSWORD:-local-only-change-me}@postgres:5432/e11e
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started
    command: ["node", "src/scheduler.js"]
    restart: unless-stopped

volumes:
  e11e_postgres:
  e11e_redis:
